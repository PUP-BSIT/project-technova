# Production Database (uses environment variables)
spring.datasource.url=jdbc:mysql://localhost:3306/db_technova_reservation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Don't show SQL in production
spring.jpa.show-sql=false

# Production logging
logging.level.root=WARN
logging.level.com.campus.facility_reservation=INFO
logging.level.org.springframework.security=WARN