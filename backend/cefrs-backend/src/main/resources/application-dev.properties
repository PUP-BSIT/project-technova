# For local development with XAMPP (no password)

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/db_technova_reservation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Show SQL for debugging in development
spring.jpa.show-sql=true