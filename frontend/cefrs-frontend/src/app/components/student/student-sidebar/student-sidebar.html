<aside class="sidebar" 
  [class.is-collapsed]="!isSidebarOpen" 
  [class.is-mobile]="isMobileView"
  [class.collapsed-desktop]="isCollapsed && isDesktop">
  @if (isDesktop) {
    <button class="collapse-btn" (click)="toggleCollapse()" [title]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      @if (isCollapsed) {
        <!-- Arrow right icon when collapsed (to expand) -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      } @else {
        <!-- X icon when expanded (to collapse) -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      }
    </button>
  }
  <div class="logo-section">
    <div class="logo-image">
      <img src="assets/logo-white.png" alt="CEFRS Logo" />
    </div>
    <div class="logo-text" [class.hide-on-collapse]="isCollapsed && isDesktop">CEFRS</div>
  </div>

  <nav class="nav-menu">
    <button class="nav-item" 
      [class.active]="currentView === 'dashboard'" 
      (click)="navigateTo('dashboard')"
      [title]="isCollapsed && isDesktop ? 'Dashboard' : ''">
      <img src="assets/dashboard.png" alt="Dashboard Icon" class="icon" />
      <span [class.hide-on-collapse]="isCollapsed && isDesktop">Dashboard</span>
    </button>
    <button class="nav-item" 
      [class.active]="currentView === 'facilities'" 
      (click)="navigateTo('facilities')"
      [title]="isCollapsed && isDesktop ? 'Facilities' : ''">
      <img src="assets/facilities.png" alt="Facilities Icon" class="icon-2" />
      <span [class.hide-on-collapse]="isCollapsed && isDesktop">Facilities</span>
    </button>
    <button class="nav-item" 
      [class.active]="currentView === 'equipment'" 
      (click)="navigateTo('equipment')"
      [title]="isCollapsed && isDesktop ? 'Equipment' : ''">
      <img src="assets/equipment.png" alt="Equipment Icon" class="icon-2" />
      <span [class.hide-on-collapse]="isCollapsed && isDesktop">Equipment</span>
    </button>
    <button class="nav-item" 
      [class.active]="currentView === 'requests'" 
      (click)="navigateTo('requests')"
      [title]="isCollapsed && isDesktop ? 'My Request' : ''">
      <img src="assets/requests.png" alt="Requests Icon" class="icon-2" />
      <span [class.hide-on-collapse]="isCollapsed && isDesktop">My Request</span>
    </button>
    <!-- <button class="nav-item" [class.active]="currentView === 'transactions'" (click)="navigateTo('transactions')">Transactions</button> -->
    <button class="nav-item" 
      [class.active]="currentView === 'settings'" 
      (click)="navigateTo('settings')"
      [title]="isCollapsed && isDesktop ? 'Settings' : ''">
      <img src="assets/settings.png" alt="Settings Icon" class="icon-2" />
      <span [class.hide-on-collapse]="isCollapsed && isDesktop">Settings</span>
    </button>
  </nav>

  <div class="user-profile">
    <div class="user-details" [class.hide-on-collapse]="isCollapsed && isDesktop">
      @if (user) {
        <div class="user-info">
          <div class="user-name">{{ user.name }}</div>
          <div class="user-email">{{ user.email }}</div>
        </div>
      } @else {
        <div class="user-info">
          <div class="user-name">Loading...</div>
          <div class="user-email">Please wait...</div>
        </div>
      }
    </div>
    <button class="logout-btn" (click)="logout()" title="Logout">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
      </svg>
    </button>
  </div>
  
  <!-- Logout Confirmation Modal -->
  @if (showLogoutModal) {
    <div class="modal-overlay" (click)="closeLogoutModal()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
          <h3>Confirm Logout</h3>
          <button class="close-btn" (click)="closeLogoutModal()">×</button>
        </div>

        <div class="modal-body">
          <p>Are you sure you want to logout?</p>
        </div>

        <div class="modal-footer">
          <button class="btn-confirm" (click)="confirmLogout()">Yes, Logout</button>
          <button class="btn-cancel" (click)="closeLogoutModal()">Cancel</button>
        </div>
      </div>
    </div>
  }
</aside>
