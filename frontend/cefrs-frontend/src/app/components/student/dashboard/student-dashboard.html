<mat-sidenav-container class="dashboard-container">
  <mat-sidenav 
    #sidenav
    [(opened)]="isSidebarOpen"
    [mode]="isMobileView ? 'over' : 'side'"
    [fixedInViewport]="!isMobileView"
    [fixedTopGap]="0"
    [fixedBottomGap]="0"
    class="sidebar-sidenav">
    <app-student-sidebar 
      [currentView]="currentView" 
      [sidenav]="sidenav"
      (viewChanged)="onSidebarViewChange($event)">
    </app-student-sidebar>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <!-- Hamburger button - visible on both mobile and desktop -->
    <button
      mat-icon-button
      class="hamburger-button"
      type="button"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="isSidebarOpen"
      aria-label="Toggle navigation menu">
      <span class="hamburger-icon" [class.is-open]="isSidebarOpen">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

    @if (currentView === 'settings') {
      <router-outlet></router-outlet>
    }

    @if (currentView === 'dashboard') {
      <app-dashboard></app-dashboard>
    }

    @if (currentView === 'facilities') {
      <app-facilities></app-facilities>
    }

    @if (currentView === 'equipment') {
      <app-equipment></app-equipment>
    }

    @if (currentView === 'requests') {
      <app-my-requests></app-my-requests>
    }
  </mat-sidenav-content>
</mat-sidenav-container>
