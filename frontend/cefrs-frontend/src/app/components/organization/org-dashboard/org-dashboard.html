<div class="dashboard-container"
  [class.sidebar-open]="isSidebarOpen"
  [class.sidebar-closed]="!isSidebarOpen"
  [class.is-mobile]="isMobileView">
  @if (isMobileView) {
    <button
      class="mobile-menu-button"
      type="button"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="isSidebarOpen"
      aria-label="Toggle navigation menu">
      <span class="hamburger" [class.is-open]="isSidebarOpen"></span>
    </button>
  }

  <!-- Sidebar Component -->
  <app-org-sidebar 
    [currentView]="currentView" 
    [isSidebarOpen]="isSidebarOpen"
    [isMobileView]="isMobileView"
    (viewChanged)="onSidebarViewChange($event)">
  </app-org-sidebar>

  @if (isMobileView && isSidebarOpen) {
    <div class="sidebar-overlay" (click)="closeSidebar()"></div>
  }

  <!-- Main Content -->
  <main class="main-content">
    @if (currentView === 'settings') {
      <router-outlet></router-outlet>
    }

    @if (currentView === 'dashboard') {
      <app-dashboard></app-dashboard>
    }

    @if (currentView === 'facilities') {
      <app-org-facilities></app-org-facilities>
    }

    @if (currentView === 'equipment') {
      <app-org-equipment></app-org-equipment>
    }

    @if (currentView === 'requests') {
      <app-org-my-request></app-org-my-request>
    }
  </main>
</div>
