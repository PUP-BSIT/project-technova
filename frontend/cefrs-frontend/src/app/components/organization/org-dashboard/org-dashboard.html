<!-- Mobile Hamburger Button - visible only on mobile -->
@if (isMobileView) {
  <button 
    class="mobile-hamburger-button" 
    [class.is-open]="isSidebarOpen"
    (click)="toggleSidebar()" 
    [attr.aria-expanded]="isSidebarOpen"
    aria-label="Toggle navigation menu">
    @if (isSidebarOpen) {
      <!-- X icon when sidebar is open -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    } @else {
      <!-- Hamburger icon when sidebar is closed -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    }
  </button>
}

<mat-sidenav-container class="dashboard-container" [class.sidebar-collapsed-container]="isSidebarCollapsed && !isMobileView">
  <mat-sidenav 
    #sidenav
    [(opened)]="isSidebarOpen"
    [mode]="isMobileView ? 'over' : 'side'"
    [fixedInViewport]="!isMobileView"
    [fixedTopGap]="0"
    [fixedBottomGap]="0"
    class="sidebar-sidenav"
    [class.sidebar-collapsed]="isSidebarCollapsed && !isMobileView">
    <app-org-sidebar 
      [currentView]="currentView" 
      [sidenav]="sidenav"
      (viewChanged)="onSidebarViewChange($event)"
      (collapsedChanged)="onSidebarCollapsedChange($event)">
    </app-org-sidebar>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    @if (currentView === 'settings' || currentView === 'contact') {
      <router-outlet></router-outlet>
    }

    @if (currentView === 'dashboard') {
      <app-dashboard (viewChangeRequest)="onSidebarViewChange($event)"></app-dashboard>
    }

    @if (currentView === 'facilities') {
      <app-org-facilities></app-org-facilities>
    }

    @if (currentView === 'equipment') {
      <app-org-equipment></app-org-equipment>
    }

    @if (currentView === 'requests') {
      <app-org-my-request></app-org-my-request>
    }
  </mat-sidenav-content>
</mat-sidenav-container>
